<div class="var-browser">
<div class="vb-controls">
<input type="search" id="vb-search" class="vb-search" placeholder="Search name or label&hellip;" aria-label="Search variables"/>
<div class="vb-chips" id="vb-chips"></div>
<span class="vb-count" id="vb-count"></span>
</div>
<div class="vb-scroll">
<table class="vb-table" id="vb-table"><thead></thead><tbody></tbody></table>
</div>
</div>
<script>
(function () {
  var ROLE_COLORS = {
    id: "#989ca3",
    outcome: "#d64550",
    hazard: "#e8830c",
    ind: "#35678d",
    hh: "#337f6c",
    firm: "#8f5d99",
    area: "#2596be",
    interact: "#b8860b",
    fe: "#c05555"
  };
  var ROLE_LABELS = {
    id: "ID",
    outcome: "Outcome",
    hazard: "Hazard",
    ind: "Ind",
    hh: "HH",
    firm: "Firm",
    area: "Area",
    interact: "Interact",
    fe: "FE"
  };
  var ROLE_TITLES = {
    id: "Identifier, date, or administrative variable",
    outcome: "Can serve as dependent welfare outcome",
    hazard: "Weather or climate hazard metric",
    ind: "Available in individual-level data",
    hh: "Available in household-level data",
    firm: "Available in firm-level data",
    area: "Measured at the geographic/community level",
    interact: "Available as a policy/resilience interaction term",
    fe: "Available as a fixed effect in regression models"
  };
  function parseCSV(text) {
    var rows = [], row = [], field = "", quoted = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (quoted) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else { quoted = false; }
        } else { field += c; }
      } else if (c === '"') {
        quoted = true;
      } else if (c === ',') {
        row.push(field); field = "";
      } else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(field); rows.push(row);
        row = []; field = "";
      } else {
        field += c;
      }
    }
    if (field !== "" || row.length > 0) { row.push(field); rows.push(row); }
    return rows;
  }
  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  var TEXT_COLS = ["name", "label", "type", "units"];
  var FLAG_COLS = ["id", "outcome", "hazard", "ind", "hh", "firm", "area", "interact", "fe"];
  var root = document.querySelector(".var-browser");
  var thead = document.getElementById("vb-table").querySelector("thead");
  var tbody = document.getElementById("vb-table").querySelector("tbody");
  var searchBox = document.getElementById("vb-search");
  var chipBar = document.getElementById("vb-chips");
  var countEl = document.getElementById("vb-count");
  var records = [];
  var query = "";
  var activeFlags = {};
  var sortIndex = null;
  FLAG_COLS.forEach(function (f) { activeFlags[f] = false; });
  buildHeader();
  buildChips();
  searchBox.addEventListener("input", function () {
    query = searchBox.value.trim().toLowerCase();
    renderBody();
  });
  fetch("assets/variable_list.csv")
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    })
    .then(function (text) {
      var rows = parseCSV(text.trim());
      var header = rows.shift();
      var idx = {};
      header.forEach(function (h, j) { idx[h] = j; });
      records = rows.filter(function (row) { return !!row[idx["name"]]; })
        .map(function (row) {
          var rec = {};
          header.forEach(function (h, j) { rec[h] = row[j]; });
          return rec;
        });
      renderBody();
    })
    .catch(function (err) {
      document.getElementById("vb-table").outerHTML =
        '<p style="color:#b02a37">Variable list could not be loaded: ' +
        esc(err.message) + "</p>";
    });
  function buildHeader() {
    var tr = document.createElement("tr");
    TEXT_COLS.forEach(function (col, i) {
      var th = document.createElement("th");
      th.textContent = col.charAt(0).toUpperCase() + col.slice(1);
      th.classList.add("vb-sortable");
      th.dataset.colIndex = String(i);
      th.title = "Click to sort";
      th.addEventListener("click", function () {
        sortIndex = sortIndex === i ? null : i;
        Array.prototype.forEach.call(tr.children, function (c) {
          c.classList.remove("vb-sorted");
        });
        if (sortIndex === i) th.classList.add("vb-sorted");
        renderBody();
      });
      tr.appendChild(th);
    });
    FLAG_COLS.forEach(function (f) {
      var th = document.createElement("th");
      th.textContent = ROLE_LABELS[f];
      th.className = "vb-role-col";
      th.title = ROLE_TITLES[f];
      th.style.color = ROLE_COLORS[f];
      tr.appendChild(th);
    });
    thead.appendChild(tr);
  }
  function buildChips() {
    FLAG_COLS.forEach(function (f) {
      var chip = document.createElement("button");
      chip.type = "button";
      chip.className = "vb-chip";
      chip.textContent = ROLE_LABELS[f];
      chip.title = ROLE_TITLES[f];
      chip.dataset.flag = f;
      chip.style.setProperty("--chip-color", ROLE_COLORS[f]);
      chip.addEventListener("click", function () {
        activeFlags[f] = !activeFlags[f];
        chip.classList.toggle("vb-chip-active", activeFlags[f]);
        renderBody();
      });
      chipBar.appendChild(chip);
    });
  }
  function visibleRecords() {
    return records.filter(function (rec) {
      for (var f in activeFlags) {
        if (activeFlags[f] && rec[f] !== "1") return false;
      }
      if (query) {
        var hay = (rec["name"] + " " + rec["label"]).toLowerCase();
        if (hay.indexOf(query) === -1) return false;
      }
      return true;
    });
  }
  function renderBody() {
    var visible = visibleRecords();
    if (sortIndex !== null) {
      var col = TEXT_COLS[sortIndex];
      visible = visible.slice().sort(function (a, b) {
        return a[col].localeCompare(b[col], undefined, { numeric: true });
      });
    }
    countEl.textContent = "Showing " + visible.length + " of " + records.length + " variables";
    var frag = document.createDocumentFragment();
    visible.forEach(function (rec) {
      var tr = document.createElement("tr");
      var tdName = document.createElement("td");
      var code = document.createElement("code");
      code.textContent = rec["name"];
      tdName.appendChild(code);
      tr.appendChild(tdName);
      var tdLabel = document.createElement("td");
      tdLabel.textContent = rec["label"];
      tr.appendChild(tdLabel);
      var tdType = document.createElement("td");
      tdType.textContent = rec["type"];
      tdType.className = "vb-type";
      tr.appendChild(tdType);
      var tdUnits = document.createElement("td");
      tdUnits.className = "vb-type";
      tdUnits.textContent = rec["units"] === "NA" ? "\u2013" : rec["units"];
      tr.appendChild(tdUnits);
      FLAG_COLS.forEach(function (f) {
        var td = document.createElement("td");
        td.className = "vb-flag-cell";
        var dot = document.createElement("span");
        if (rec[f] === "1") {
          dot.className = "vb-dot";
          dot.style.background = ROLE_COLORS[f];
          td.title = rec["name"] + ": " + ROLE_TITLES[f];
        } else {
          dot.className = "vb-dot vb-dot-empty";
        }
        td.appendChild(dot);
        tr.appendChild(td);
      });
      frag.appendChild(tr);
    });
    tbody.innerHTML = "";
    tbody.appendChild(frag);
  }
})();
</script>
